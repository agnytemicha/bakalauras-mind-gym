# Šis kodas buvo sugeneruotas naudojant ChatGPT, 5,5 versija
# Užklausa: Create a simple Docker setup for a Laravel + Vue/Inertia + Vite project. Use: PHP 8.4, Node 22, MySQL 8.4, Composer, phpMyAdmin, MySQL as the database, include phpMyAdmin
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mind-gym-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      - db
    command: bash -c "composer install && npm install && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.4
    container_name: mind-gym-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-mind_gym}"
      MYSQL_USER: "${DB_USERNAME:-mind_gym}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-mind_gym}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mind-gym-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  vendor:
  node_modules:
  mysql_data: